name: Security Scan

# Static security checks for every push and pull request.
# Fails on HIGH/CRITICAL findings (secrets, injection, destructive payloads).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Codebase security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run security scan
        run: zig build security-scan -- --fail-on high

      - name: Unit tests (incl. security suite)
        run: zig build test

name: Release (2026-live)

# When VERSION is bumped and you push to 2026-live, this workflow:
#   1. Creates git tag vX.Y.Z
#   2. Publishes a GitHub Release (nice notes from CHANGELOG)
#   3. Moves the floating tag `latest` to this commit (badge-friendly)

on:
  push:
    branches:
      - 2026-live
  workflow_dispatch:
    inputs:
      force:
        description: "Re-create tag/release if vVERSION already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-2026-live
  cancel-in-progress: false

jobs:
  release:
    name: Tag & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Needed so the workflow can push tags back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION
        id: ver
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be semver X.Y.Z (got: ${VERSION})"
            exit 1
          fi
          TAG="v${VERSION}"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

      - name: Extract changelog section
        id: notes
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"

          {
            echo "## Orbit ${TAG}"
            echo
            echo "GPU terminal for staying in the flow — [marksikaundi/Orbit](https://github.com/marksikaundi/Orbit)."
            echo
            if [[ -f CHANGELOG.md ]]; then
              awk -v ver="$VERSION" '
                $0 ~ "^## \\[" ver "\\]" { capture=1; print; next }
                capture && /^## \[/ { exit }
                capture { print }
              ' CHANGELOG.md
            fi
            echo
            echo "---"
            echo
            printf '**Branch:** `2026-live` · **Commit:** `%s`\n' "$SHORT_SHA"
            echo
            echo "### Prebuilt install"
            echo
            echo "Download the archive for your OS from the Assets list below, then:"
            echo
            echo "- **macOS:** unzip and drag \`Orbit.app\` to Applications. Optional signing: set \`ORBIT_SIGN_IDENTITY\` when packaging."
            echo "- **Linux:** \`tar -xzf orbit-*-linux-*.tar.gz && sudo install -m 755 orbit/orbit /usr/local/bin/orbit\`"
            echo "- **Windows:** unzip and run \`orbit.exe\` (or copy to \`%LOCALAPPDATA%\\Orbit\\bin\`)."
            echo
            echo "### Already installed?"
            echo
            echo "From any terminal (after \`zig build setup\`):"
            printf '%s\n' '```bash'
            echo "orbit update --check"
            echo "orbit update"
            printf '%s\n' '```'
            echo
            echo "\`orbit update\` prefers a matching prebuilt asset, then falls back to git pull + rebuild."
            echo
            echo "### Install (from source)"
            printf '%s\n' '```bash'
            echo "git clone https://github.com/marksikaundi/Orbit.git"
            echo "cd Orbit && git checkout ${TAG}"
            echo "zig build -Doptimize=ReleaseFast"
            echo "zig build setup"
            printf '%s\n' '```'
          } > "$NOTES_FILE"

          echo "path=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create or update tag
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING="$(git rev-list -n 1 "$TAG")"
            if [[ "$EXISTING" == "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already points at this commit."
            elif [[ "$FORCE" == "true" ]]; then
              echo "Force-updating tag $TAG → $GITHUB_SHA"
              git tag -f -a "$TAG" -m "Orbit $TAG"
              git push -f origin "refs/tags/$TAG"
            else
              echo "::error::Tag $TAG already exists on another commit."
              echo "Bump VERSION with ./scripts/bump-version.sh patch|minor|major,"
              echo "or re-run this workflow with force=true to move the tag."
              exit 1
            fi
          else
            git tag -a "$TAG" -m "Orbit $TAG"
            git push origin "refs/tags/$TAG"
            echo "Created tag $TAG"
          fi

          # Floating pointers for badges / "what's live"
          git tag -f -a latest -m "Latest release on 2026-live ($TAG)"
          git push -f origin refs/tags/latest
          git tag -f -a 2026-live-latest -m "Latest 2026-live release ($TAG)"
          git push -f origin refs/tags/2026-live-latest

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
          TAG: ${{ steps.ver.outputs.tag }}
          NOTES: ${{ steps.notes.outputs.path }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$FORCE" == "true" ]]; then
              gh release edit "$TAG" --title "Orbit $TAG" --notes-file "$NOTES" --latest
            else
              echo "Release $TAG already exists — leaving notes unchanged."
              echo "Use workflow_dispatch with force=true to refresh."
            fi
          else
            gh release create "$TAG" \
              --title "Orbit $TAG" \
              --notes-file "$NOTES" \
              --latest
          fi
          echo "Release page: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

  package:
    name: Prebuilt (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install GLFW (macOS)
        if: runner.os == 'macOS'
        run: brew install glfw

      - name: Install GLFW (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libgl1-mesa-dev libx11-dev pkg-config

      - name: Package
        shell: bash
        env:
          ORBIT_SIGN_IDENTITY: ${{ secrets.ORBIT_SIGN_IDENTITY }}
          ORBIT_NOTARIZE: ${{ secrets.ORBIT_NOTARIZE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/package.sh

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          shopt -s nullglob
          files=(zig-out/dist/orbit-"${VERSION}"-*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No archives in zig-out/dist" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "Uploaded ${files[*]} to $TAG"

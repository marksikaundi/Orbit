# Orbit config — copy to ~/.config/orbit/config.toml (Unix)
# or %APPDATA%\orbit\config.toml (Windows)
# Or open Appearance (S on home) and press S to save.

[window]
width = 980
height = 620
opacity = 1.0

[theme]
# orbit-dark | orbit-light | nord | dracula | gruvbox-dark | solarized-dark
name = "orbit-dark"
# Text color override (optional). theme | soft-white | bright | cool-gray | warm-gray
# mint | green | amber | sky | lavender | rose
foreground = "theme"

[terminal]
scrollback = 2000
# Point size (Ghostty-style). Retina scale is applied automatically.
font_size = 14
# Interior padding in logical pixels
padding_x = 10
padding_y = 6
# Shell for new tabs (omit for platform default).
# Unix: "/bin/zsh" "/bin/bash" "/bin/fish"
# Windows: "powershell.exe" "pwsh.exe" "cmd.exe"
# shell = "/bin/zsh"
# Cursor: block | underline | bar
cursor_style = "block"
cursor_blink = true

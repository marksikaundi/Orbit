# Orbit config — copy to ~/.config/orbit/config.toml
# Or open Appearance (S on home) and press S to save.

[window]
width = 980
height = 620
opacity = 1.0

[theme]
# orbit-dark | orbit-light | nord | dracula | gruvbox-dark | solarized-dark
name = "orbit-dark"

[terminal]
scrollback = 2000
# Point size (Ghostty-style). Retina scale is applied automatically.
font_size = 14
# Interior padding in logical pixels
padding_x = 10
padding_y = 6
# Shell for new tabs (omit to use $SHELL). Examples: /bin/zsh /bin/bash /bin/fish
# shell = "/bin/zsh"
# Cursor: block | underline | bar
cursor_style = "block"
cursor_blink = true
